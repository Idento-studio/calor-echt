<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calor — Lunch &amp; Bar in Echt | Binnenkort open</title>
<meta name="description" content="Calor Lunch &amp; Bar in Echt opent binnenkort de deuren. Spaanse tapas, bites en signature cocktails. Bovenstestraat 4, Echt.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://calor-echt.nl/">
<meta name="theme-color" content="#3D1414">

<meta property="og:type" content="website">
<meta property="og:title" content="Calor — Lunch &amp; Bar in Echt | Binnenkort open">
<meta property="og:description" content="De ziel van Spanje, gevangen in een glas en geserveerd op een plankje. Binnenkort open in Echt.">
<meta property="og:image" content="https://calor-echt.nl/assets/img/hero-interior.jpg">
<meta property="og:locale" content="nl_NL">

<link rel="icon" href="assets/img/cropped-Favicon-1.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/cropped-Favicon-1.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --wine:#3D1414; --wine-deep:#2A0E0E;
  --gold:#F1D68A; --sand:#EBCFA0; --cream:#FDF5E6; --muted:#B8A89A; --rose:#FF3D78;
  --serif:"Playfair Display", Georgia, serif;
  --sans:"Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100svh; background:var(--wine); color:var(--sand);
  font-family:var(--sans); font-size:15px; line-height:1.85; letter-spacing:.01em;
  display:grid; place-items:center; text-align:center; overflow-x:hidden;
}
img{max-width:100%}
a{color:inherit}

.wrap{position:relative; min-height:100svh; width:100%; display:grid; place-items:center; padding:clamp(32px,6vw,64px) 20px;}
.bg{position:absolute; inset:0; background:url("assets/img/hero-interior.jpg") center bottom/cover no-repeat; transform:scale(1.06);}
.bg::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(120% 78% at 50% 42%, rgba(61,20,20,.5) 0%, rgba(42,14,14,.88) 62%, rgba(30,9,9,.97) 100%),
    linear-gradient(180deg, rgba(42,14,14,.85) 0%, transparent 30%, transparent 65%, var(--wine) 100%);
}
.in{position:relative; z-index:2; max-width:640px;}

.eyebrow{
  font-size:11px; font-weight:600; letter-spacing:.5em; text-transform:uppercase;
  color:var(--sand); opacity:.9; margin:0 0 clamp(18px,3vw,28px);
}
.logo{width:min(100%,420px); height:auto; margin:0 auto; filter:drop-shadow(0 0 46px rgba(241,214,138,.28));}
.tag{
  font-family:var(--serif); font-style:italic; font-weight:600;
  font-size:clamp(1.5rem,4vw,2.2rem); color:var(--rose);
  margin:clamp(18px,3vw,26px) 0 clamp(20px,3vw,28px);
  text-shadow:0 0 26px rgba(255,61,120,.55), 0 0 60px rgba(255,61,120,.3);
}
.copy{max-width:42ch; margin:0 auto clamp(28px,4vw,40px); color:var(--sand); opacity:.92;}
.contact{display:flex; flex-wrap:wrap; gap:14px 34px; justify-content:center; font-size:13px; letter-spacing:.08em;}
.contact a{text-decoration:none; border-bottom:1px solid rgba(235,207,160,.4); padding-bottom:2px; transition:color .25s,border-color .25s;}
.contact a:hover{color:var(--gold); border-color:var(--gold);}
.foot{position:relative; z-index:2; margin-top:clamp(40px,6vw,64px); font-size:11px; letter-spacing:.1em; color:var(--muted); opacity:.75;}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>

<div class="wrap">
  <div class="bg" aria-hidden="true"></div>
  <div class="in">
    <p class="eyebrow">Binnenkort open</p>
    <img class="logo" src="assets/img/Calor-text-logo-yellow-1024x268.png" alt="Calor Lunch &amp; Bar" width="1024" height="268">
    <p class="tag">Lunch &amp; Bar</p>
    <p class="copy">We zijn volop aan het bouwen aan iets moois. Binnenkort verwelkomen we jullie in Echt met Spaanse tapas, bites en signature cocktails.</p>
    <div class="contact">
      <a href="mailto:info@calor-echt.nl">info@calor-echt.nl</a>
      <a href="https://www.instagram.com/calor.echt/" target="_blank" rel="noopener">@calor.echt</a>
    </div>
    <p class="foot">Bovenstestraat 4, 6101 EK Echt</p>
  </div>
</div>

</body>
</html>
